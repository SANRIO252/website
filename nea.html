
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somenea | Social Links</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #050505, #191929, #090909);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 420px;
    text-align: center;
    padding: 35px 20px;
}

.profile {
    width: 110px;
    height: 110px;
    margin: auto;
    border-radius: 50%;
    background: linear-gradient(135deg, #555, #111);
    border: 3px solid white;
    display: grid;
    place-items: center;
    font-size: 42px;
    margin-bottom: 20px;
}

h1 {
    font-size: 32px;
    letter-spacing: 2px;
}

p {
    color: #aaa;
    margin: 12px 0 30px;
}

.social {
    display: block;
    padding: 18px;
    margin: 16px 0;
    border-radius: 14px;
    text-decoration: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.social:hover {
    transform: translateY(-5px);
    filter: brightness(1.2);
}

.facebook {
    background: #1877F2;
}

.tiktok {
    background: #171717;
    border: 1px solid #555;
}

.telegram {
    background: #229ED9;
}

.username {
    display: block;
    font-size: 12px;
    opacity: 0.8;
    margin-top: 5px;
}

footer {
    color: #666;
    font-size: 12px;
    margin-top: 35px;
}
</style>
</head>

<body>

<div class="container">

    <div class="profile">S</div>

    <h1>SOMENEA</h1>
    <p>Welcome to my social world ✨</p>

    <a class="social facebook"
       href="https://www.facebook.com/share/1Q7E59fwqa/"
       target="_blank">
       📘 Facebook Page
       <span class="username">Follow my page</span>
    </a>

    <a class="social tiktok"
       href="https://www.tiktok.com/@s0menea"
       target="_blank">
       🎵 TikTok
       <span class="username">@s0menea</span>
    </a>

    <a class="social telegram"
       href="https://t.me/@Somaknea_12"
       target="_blank">
       ✈️ Telegram
       <span class="username">@Somaknea_12</span>
    </a>

    <footer>
        © 2026 SOMENEA | All Rights Reserved
    </footer>

</div>

</body>
</html>
